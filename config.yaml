server:
  port: 8080
  host: 0.0.0.0
  web_path: "${WEB_PATH}"  # Web 界面路径，默认为空（根路径 /）

auth:
  enabled: true
  api_keys:
    - ${API_KEY}

storage:
  type: "${STORAGE_TYPE}"
  path: "${STORAGE_PATH}"
  repo_id: "${HF_REPO_ID}"
  token: "${HF_TOKEN}"

templates:
  dir: ./templates
  default: default

clash:
  default_rules: default
