<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置编辑器 - Subconverter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="grain"></div>

    <div class="page">
        <header class="hero">
            <div class="hero-top">
                <span class="badge">Config Editor</span>
                <div class="status-pill">
                    <span class="pulse"></span>
                    <span>Secure · Editable</span>
                </div>
            </div>
            <h1>配置编辑器</h1>
            <p class="subtitle">管理和编辑你的订阅配置，支持长链接和短链接。</p>
        </header>

        <nav class="nav-tabs">
            <a href="index.html" class="nav-tab">转换工具</a>
            <a href="configs.html" class="nav-tab active">配置管理</a>
        </nav>

        <main class="layout">
            <div class="column">
                <!-- 加载配置 -->
                <section class="card card-spotlight">
                    <div class="card-title">
                        <h2>加载配置</h2>
                        <span class="card-tag">Load Config</span>
                    </div>
                    <div class="form-group">
                        <label>API 密钥 (必填以管理列表)</label>
                        <input type="password" id="apiKey" placeholder="输入 API 密钥以管理历史配置">
                    </div>
                    <div class="form-group">
                        <label>手动加载</label>
                        <input type="text" id="configInput" placeholder="粘贴完整链接或输入短链接 ID">
                    </div>
                    <div class="actions">
                        <button class="btn btn-primary" onclick="loadConfig()">
                            <span class="btn-icon">📥</span>
                            加载
                        </button>
                    </div>
                </section>

                <!-- 历史配置列表 -->
                <section class="card" id="historySection">
                    <div class="card-title">
                        <h2>我的配置</h2>
                        <button class="btn btn-icon-only btn-secondary" onclick="fetchConfigList()" title="刷新列表">
                            <span class="btn-icon">🔄</span>
                        </button>
                    </div>
                    <div id="configList" class="config-list">
                        <div class="empty-state">
                            <p>输入密钥后点击刷新按钮</p>
                            <small>自动加载功能即将上线</small>
                        </div>
                    </div>
                </section>
            </div>

            <div class="column">
                <!-- 配置编辑器 -->
                <section class="card" id="editorSection" style="display: none;">
                    <div class="card-title">
                        <h2>配置详情</h2>
                        <span class="card-tag" id="configType">-</span>
                    </div>

                    <input type="hidden" id="configId">

                    <div class="form-group">
                        <label>订阅链接</label>
                        <div id="urlsList"></div>
                        <button class="btn btn-secondary btn-sm" onclick="addUrlInput()">
                            <span class="btn-icon">➕</span>
                            添加订阅
                        </button>
                    </div>

                    <div class="form-group">
                        <label>单独节点（可选）</label>
                        <div id="nodesList"></div>
                        <button class="btn btn-secondary btn-sm" onclick="addNodeInput()">
                            <span class="btn-icon">➕</span>
                            添加节点
                        </button>
                    </div>

                    <div class="form-group">
                        <label>客户端类型</label>
                        <select id="targetFormat">
                            <option value="clash">Clash</option>
                            <option value="singbox">Sing-box</option>
                            <option value="surge" data-ver="4">Surge 4</option>
                            <option value="surge" data-ver="3">Surge 3</option>
                            <option value="quanx">Quantumult X</option>
                            <option value="loon">Loon</option>
                            <option value="v2ray">V2Ray</option>
                            <option value="ss">Shadowsocks</option>
                            <option value="ssr">ShadowsocksR</option>
                            <option value="mixed">Mixed 通用格式</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>规则模板（可选）</label>
                        <select id="configTemplate">
                            <option value="">默认</option>
                            <option value="default">Default</option>
                            <option value="acl4ssr">ACL4SSR（本地）</option>
                            <optgroup label="ACL4SSR 在线版">
                                <option value="acl4ssr_online">在线基础版</option>
                                <option value="acl4ssr_online_full">在线完整版</option>
                                <option value="acl4ssr_online_mini">在线精简版</option>
                                <option value="acl4ssr_online_adblock">强化去广告版</option>
                                <option value="acl4ssr_online_noauto">无自动测速版</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>包含关键词（可选）</label>
                        <input type="text" id="includeFilter" placeholder="香港|日本|美国">
                    </div>

                    <div class="form-group">
                        <label>排除关键词（可选）</label>
                        <input type="text" id="excludeFilter" placeholder="x2|x3|过期">
                    </div>

                    <div class="actions">
                        <button class="btn btn-primary" onclick="saveConfig()">
                            <span class="btn-icon">💾</span>
                            保存配置
                        </button>
                        <button class="btn btn-secondary" onclick="previewConfig()">
                            <span class="btn-icon">🎨</span>
                            预览转换
                        </button>
                        <button class="btn btn-secondary" onclick="resetEditor()">
                            <span class="btn-icon">🧹</span>
                            重置
                        </button>
                        <button class="btn btn-danger" onclick="deleteConfig()" id="deleteBtn" style="display: none;">
                            <span class="btn-icon">🗑️</span>
                            删除配置
                        </button>
                    </div>

                    <!-- 短链接显示 -->
                    <div id="shortLinkDisplay" style="display: none; margin-top: 1.5rem;">
                        <div class="form-group">
                            <label>短链接</label>
                            <div class="result-url">
                                <input type="text" id="shortLinkUrl" readonly>
                                <button class="btn btn-copy" onclick="copyShortLink()">
                                    <span class="btn-icon">📋</span>
                                    复制
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <p>
                <a href="https://github.com/Chen-ce/subconverter" target="_blank">
                    <span class="footer-icon">⭐</span>
                    GitHub
                </a>
                |
                <a href="health.html">
                    <span class="footer-icon">💚</span>
                    服务状态
                </a>
            </p>
            <p class="footer-text">Subconverter Engine</p>
        </footer>
    </div>

    <script src="toast.js"></script>
    <script src="configs.js"></script>
</body>

</html>
