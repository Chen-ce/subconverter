version: '3.8'

services:
  subconverter:
    build: .
    container_name: subconverter
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - API_KEY=${API_KEY}
      - WEB_PATH=${WEB_PATH:-}
      - STORAGE_TYPE=${STORAGE_TYPE:-json}
      - STORAGE_PATH=${STORAGE_PATH:-./data/configs}
      - HF_REPO_ID=${HF_REPO_ID}
      - HF_TOKEN=${HF_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./templates:/app/templates
      - ./data:/app/data  # 配置持久化
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
