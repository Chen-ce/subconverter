version: '3.8'

services:
  subconverter:
    build: .
    container_name: subconverter
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - ./config.yaml:/root/config.yaml:ro
      - ./templates:/root/templates:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
