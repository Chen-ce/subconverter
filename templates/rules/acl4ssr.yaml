port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1

proxy-groups:
  # 主选择组
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🎯 全球直连
      - {{proxies}}
  
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - {{proxies}}
  
  # 流媒体服务
  - name: 📺 Netflix
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - {{proxies}}
  
  - name: 🎬 Disney+
    type: select
    proxies:
      - 🚀 节点选择
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇺🇲 美国节点
  
  - name: 📹 YouTube
    type: select
    proxies:
      - 🚀 节点选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
  
  - name: 🎵 Spotify
    type: select
    proxies:
      - 🚀 节点选择
      - 🇭🇰 香港节点
      - 🇺🇲 美国节点
  
  # AI 服务
  - name: 🤖 ChatGPT
    type: select
    proxies:
      - 🚀 节点选择
      - 🇺🇲 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
  
  # 通讯工具
  - name: 📲 Telegram
    type: select
    proxies:
      - 🚀 节点选择
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - {{proxies}}
  
  # 地区节点组
  - name: 🇭🇰 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - {{proxies|filter:香港|HK|Hong Kong}}
  
  - name: 🇨🇳 台湾节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - {{proxies|filter:台湾|TW|Taiwan}}
  
  - name: 🇸🇬 狮城节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - {{proxies|filter:新加坡|狮城|SG|Singapore}}
  
  - name: 🇯🇵 日本节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - {{proxies|filter:日本|JP|Japan}}
  
  - name: 🇺🇲 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - {{proxies|filter:美国|US|United States}}
  
  - name: 🇰🇷 韩国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - {{proxies|filter:韩国|KR|Korea}}
  
  # 其他
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
  
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连

rules:
  # 广告拦截
  - RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Advertising/Advertising.yaml,🛑 广告拦截
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt,🛑 广告拦截
  
  # 流媒体
  - RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Netflix/Netflix.yaml,📺 Netflix
  - RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Disney/Disney.yaml,🎬 Disney+
  - RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/YouTube/YouTube.yaml,📹 YouTube
  - RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Spotify/Spotify.yaml,🎵 Spotify
  
  # AI 服务
  - RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/OpenAI/OpenAI.yaml,🤖 ChatGPT
  - RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Bing/Bing.yaml,🤖 ChatGPT
  
  # 通讯工具
  - RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Telegram/Telegram.yaml,📲 Telegram
  
  # 局域网和私有网络
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt,🎯 全球直连
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt,🎯 全球直连
  
  # Apple & iCloud
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt,🎯 全球直连
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt,🎯 全球直连
  
  # Google
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt,🚀 节点选择
  
  # 代理服务
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt,🚀 节点选择
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt,🚀 节点选择
  
  # 国内直连
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt,🎯 全球直连
  - RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt,🎯 全球直连
  
  # GeoIP 规则
  - GEOIP,LAN,🎯 全球直连
  - GEOIP,CN,🎯 全球直连
  
  # 兜底规则
  - MATCH,🐟 漏网之鱼
